<style>
  :root {
    --bg: #0e1014;
    --bg-2: #14171d;
    --panel: #1a1d24;
    --panel-2: #21252e;
    --border: #2a2f3a;
    --text: #e6e8ec;
    --muted: #8a93a6;
    --accent: #ff6d5a;
    --accent-2: #ff8a6e;
    --blue: #4ea3ff;
    --edge: #4a5366;
    --grid: #1f2330;
  }
  html, body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .panel { background: var(--panel); border: 1px solid var(--border); }
  .btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-accent { background: var(--accent); color: #1a0a06; border: 1px solid var(--accent); }
  .btn-accent:hover { background: var(--accent-2); }
  .seg { background: var(--bg-2); border: 1px solid var(--border); border-radius: 6px; padding: 2px; display: inline-flex; gap: 2px; }
  .seg button { padding: 4px 10px; border-radius: 4px; font-size: 12px; color: var(--muted); }
  .seg button.active { background: var(--accent); color: #1a0a06; }
  input, select { background: var(--bg-2); border: 1px solid var(--border); color: var(--text); }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  #canvas { background:
    radial-gradient(circle, var(--grid) 1px, transparent 1px) 0 0 / 24px 24px,
    var(--bg);
  }
  /* Clusters fichier (mode symboles) */
  .cluster-bg { fill: rgba(20,23,29,.5); stroke: var(--border); stroke-width: 1; stroke-dasharray: 5 4; }
  .cluster-label { fill: var(--muted); font-size: 11px; font-family: 'JetBrains Mono', monospace; }
  /* Nœuds */
  .node-rect { fill: var(--panel); stroke: var(--border); stroke-width: 1.2; }
  .node-rect.selected { stroke: var(--accent); stroke-width: 2; }
  .node-rect.dimmed { opacity: .25; }
  .node-band-file     { fill: var(--accent); }
  .node-band-class    { fill: var(--accent); }
  .node-band-function { fill: var(--blue); }
  .node-band-method   { fill: #7aa6c2; }
  .node-title { fill: var(--text); font-weight: 600; font-size: 13px; }
  .node-sub   { fill: var(--muted); font-size: 11px; font-family: 'JetBrains Mono', monospace; }
  .node-stat  { fill: var(--muted); font-size: 11px; }
  .node-kind  { fill: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
  .port { fill: var(--bg-2); stroke: var(--edge); }
  /* Arêtes */
  .edge-path { fill: none; stroke-width: 1.5; }
  .edge-call    { stroke: var(--edge); }
  .edge-inherit { stroke: var(--blue); stroke-dasharray: 6 3; }
  .edge-path.out { stroke: var(--accent); stroke-width: 2.2; }
  .edge-path.in  { stroke: var(--blue);   stroke-width: 2.2; }
  .edge-path.dimmed { opacity: .12; }
  .progress-bar { background: var(--panel-2); }
  .progress-bar > div { background: var(--accent); transition: width .15s; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #2a2f3a; border-radius: 4px; }
  .legend-dot { display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:middle; margin-right:6px; }
</style>
</head>

<script type="module">
// =================================================================
//  Cartographie de dépendances — vue fichiers + vue symboles (Python)
//  Tout en CDN, aucun build. Tree-sitter chargé à la demande.
// =================================================================

// --- État global -------------------------------------------------
const state = {
  files: [],            // [{ path, content, loc }]
  view: 'files',        // 'files' | 'symbols'
  fileGraph: { nodes: [], edges: [] },
  symGraph:  { nodes: [], edges: [], clusters: [] },
  byPath: new Map(),    // pour la vue fichiers
  byId: new Map(),      // pour la vue symboles
  selected: null,
  host: 'github',
  owner: '', repo: '', branch: '', lang: 'python', dir: 'LR',
  hideIsolated: true,
  search: '',
  parser: null,         // instance tree-sitter
  pythonLang: null,
};

// --- Auto-détection sur *.github.io ------------------------------
function detectRepoFromUrl() {
  try {
    const m = location.hostname.match(/^([^.]+)\.github\.io$/i);
    if (!m) return null;
    const parts = location.pathname.split('/').filter(Boolean);
    if (!parts.length) return null;
    return `${m[1]}/${parts[0]}`;
  } catch { return null; }
}

// --- Réglages langage (mode fichiers) ----------------------------
const LANGS = {
  python: {
    exts: ['.py'],
    parse: (src) => {
      const out = new Set();
      const re = /^\s*(?:from\s+([\w\.]+)\s+import|import\s+([\w\.,\s]+))/gm;
      let m;
      while ((m = re.exec(src)) !== null) {
        if (m[1]) out.add(m[1]);
        if (m[2]) m[2].split(',').forEach(s => out.add(s.trim().split(/\s+as\s+/)[0]));
      }
      return [...out].filter(Boolean);
    },
    resolve: (mod, fromPath, allPaths) => {
      const parts = mod.split('.');
      const tries = [parts.join('/') + '.py', parts.join('/') + '/__init__.py'];
      const baseDir = fromPath.split('/').slice(0, -1);
      for (let i = 0; i <= baseDir.length; i++) {
        const prefix = baseDir.slice(0, i).join('/');
        tries.push((prefix ? prefix + '/' : '') + parts.join('/') + '.py');
        tries.push((prefix ? prefix + '/' : '') + parts.join('/') + '/__init__.py');
      }
      for (const c of tries) if (allPaths.has(c)) return c;
      return null;
    },
  },
  jsts: {
    exts: ['.js','.jsx','.ts','.tsx','.mjs','.cjs'],
    parse: (src) => { const o=new Set(); const re=/(?:import\s[^'"]*from\s+|require\(\s*|import\(\s*)['"]([^'"]+)['"]/g; let m; while((m=re.exec(src))!==null) o.add(m[1]); return [...o]; },
    resolve: (mod, fromPath, allPaths) => {
      if (!mod.startsWith('.') && !mod.startsWith('/')) return null;
      const baseDir = fromPath.split('/').slice(0, -1);
      const stack = [...baseDir];
      for (const s of mod.split('/')) { if (s==='.') continue; else if (s==='..') stack.pop(); else stack.push(s); }
      const base = stack.join('/');
      for (const e of ['','.ts','.tsx','.js','.jsx','.mjs','.cjs','/index.ts','/index.tsx','/index.js','/index.jsx']) if (allPaths.has(base+e)) return base+e;
      return null;
    },
  },
  r:   { exts:['.R','.r'], parse:(s)=>{const o=new Set();const re=/(?:library|require)\(\s*["']?([\w\.]+)|source\(\s*["']([^"']+)/g;let m;while((m=re.exec(s))!==null)o.add(m[1]||m[2]);return[...o].filter(Boolean);}, resolve:(m,f,a)=>a.has(m)?m:null },
  sql: { exts:['.sql'], parse:(s)=>{const o=new Set();const re=/(?:--\s*@?include\s+|\\i\s+)([^\s\r\n;]+\.sql)/gi;let m;while((m=re.exec(s))!==null)o.add(m[1]);return[...o];}, resolve:(m,f,a)=>a.has(m)?m:null },
};

// --- HTTP --------------------------------------------------------
function authHeaders() { const t = sessionStorage.getItem('pat'); return t ? { Authorization: `token ${t}` } : {}; }
async function ghJson(url) { const r = await fetch(url, { headers: { Accept: 'application/vnd.github+json', ...authHeaders() } }); if (!r.ok) throw new Error(`${url} → ${r.status}`); return r.json(); }
async function rawText(url) { const r = await fetch(url, { headers: authHeaders() }); if (!r.ok) throw new Error(`${url} → ${r.status}`); return r.text(); }

async function pool(items, n, fn, onProgress) {
  const it = items[Symbol.iterator](); let done = 0;
  async function worker() { for(;;){ const {value,done:d}=it.next(); if(d)return; try{await fn(value);}catch(e){console.warn(e);} done++; onProgress&&onProgress(done,items.length);} }
  await Promise.all(Array.from({length:n}, worker));
}

// =================================================================
//  Tree-sitter — chargement et extraction des symboles Python
// =================================================================
const TS_BASE = 'https://cdn.jsdelivr.net/npm/web-tree-sitter@0.20.8/';
const PY_GRAMMAR = 'https://cdn.jsdelivr.net/npm/tree-sitter-wasms@0.1.11/out/tree-sitter-python.wasm';

async function initTreeSitter() {
  if (state.parser) return;
  // web-tree-sitter est livré en UMD ; on injecte le script à la demande
  if (!window.TreeSitter) {
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = TS_BASE + 'tree-sitter.js';
      s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
  }
  await window.TreeSitter.init({ locateFile: () => TS_BASE + 'tree-sitter.wasm' });
  state.pythonLang = await window.TreeSitter.Language.load(PY_GRAMMAR);
  state.parser = new window.TreeSitter();
  state.parser.setLanguage(state.pythonLang);
}

// Extrait pour un fichier Python : imports locaux, symboles, appels par symbole.
// Retourne { imports: Map<localName, {module, symbol?}>, symbols: [{...}] }
function extractPython(filePath, source) {
  const tree = state.parser.parse(source);
  const imports = new Map();
  const symbols = [];

  // Parcours récursif manuel — les types/champs viennent de la grammaire tree-sitter-python.
  function visit(node, ctx) {
    if (!node) return;
    switch (node.type) {
      case 'import_statement': {
        // import a.b, c as d
        for (const child of node.namedChildren) {
          if (child.type === 'dotted_name') {
            const full = child.text;
            imports.set(full.split('.')[0], { module: full, symbol: null });
          } else if (child.type === 'aliased_import') {
            const name = child.childForFieldName('name')?.text;
            const alias = child.childForFieldName('alias')?.text;
            if (name && alias) imports.set(alias, { module: name, symbol: null });
          }
        }
        return;
      }
      case 'import_from_statement': {
        // from .x.y import a, b as c
        const mod = node.childForFieldName('module_name')?.text || '';
        const isRel = node.text.match(/^from\s+(\.+)/);
        const dots = isRel ? isRel[1].length : 0;
        const fullMod = (dots ? '.'.repeat(dots) : '') + mod;
        for (const child of node.namedChildren) {
          if (child === node.childForFieldName('module_name')) continue;
          if (child.type === 'dotted_name') {
            imports.set(child.text, { module: fullMod, symbol: child.text });
          } else if (child.type === 'aliased_import') {
            const name = child.childForFieldName('name')?.text;
            const alias = child.childForFieldName('alias')?.text;
            if (name && alias) imports.set(alias, { module: fullMod, symbol: name });
          }
        }
        return;
      }
      case 'class_definition': {
        const name = node.childForFieldName('name')?.text;
        if (!name) break;
        const bases = [];
        const sc = node.childForFieldName('superclasses');
        if (sc) for (const b of sc.namedChildren) bases.push(b.text);
        const id = `${filePath}::${name}`;
        symbols.push({
          id, kind: 'class', name, file: filePath,
          owner: ctx.className || null, bases,
          calls: [],
          line: node.startPosition.row + 1,
        });
        const body = node.childForFieldName('body');
        if (body) for (const c of body.namedChildren) visit(c, { className: name, funcId: null });
        return;
      }
      case 'function_definition': {
        const fname = node.childForFieldName('name')?.text;
        if (!fname) break;
        const owner = ctx.className || null;
        const display = owner ? `${owner}.${fname}` : fname;
        const id = `${filePath}::${display}`;
        const sym = {
          id, kind: owner ? 'method' : 'function', name: display, file: filePath,
          owner, bases: [], calls: [],
          line: node.startPosition.row + 1,
        };
        symbols.push(sym);
        const body = node.childForFieldName('body');
        if (body) for (const c of body.namedChildren) visit(c, { className: null, funcId: id, self: owner });
        return;
      }
      case 'call': {
        if (ctx.funcId) {
          const fn = node.childForFieldName('function');
          let callName = null;
          if (fn) {
            if (fn.type === 'identifier') callName = fn.text;
            else if (fn.type === 'attribute') {
              const obj = fn.childForFieldName('object');
              const attr = fn.childForFieldName('attribute');
              if (obj && attr && obj.type === 'identifier' && obj.text === 'self') {
                callName = `__self__.${attr.text}`;
              } else if (obj && attr && obj.type === 'identifier') {
                // potentiellement un module importé : foo.bar() → résolvable plus tard
                callName = `${obj.text}.${attr.text}`;
              }
            }
          }
          if (callName) {
            const sym = symbols.find(s => s.id === ctx.funcId);
            if (sym) sym.calls.push(callName);
          }
        }
        for (const c of node.namedChildren) visit(c, ctx);
        return;
      }
      default:
        for (const c of node.namedChildren) visit(c, ctx);
    }
  }
  visit(tree.rootNode, { className: null, funcId: null });
  tree.delete();
  return { imports, symbols };
}

// Résolution d'un nom appelé vers un symbole concret.
// `name` peut être "foo", "foo.bar", "__self__.method"
function resolveName(name, fromFile, fromOwner, imports, allPaths, symByFile, symById) {
  // 1. Appel via self → méthode de la même classe
  if (name.startsWith('__self__.')) {
    const m = name.slice('__self__.'.length);
    if (fromOwner) {
      const tid = `${fromFile}::${fromOwner}.${m}`;
      if (symById.has(tid)) return tid;
    }
    return null;
  }
  // 2. Appel module.qq
  if (name.includes('.')) {
    const [first, ...rest] = name.split('.');
    const tail = rest.join('.');
    // Le préfixe est-il un import ?
    const imp = imports.get(first);
    if (imp) {
      const targetFile = LANGS.python.resolve(imp.module.replace(/^\.+/, ''), fromFile, allPaths);
      if (targetFile) {
        const tid = `${targetFile}::${tail}`;
        if (symById.has(tid)) return tid;
        // Sinon, c'est peut-être Classe.methode où Classe a été importée → tail = 'Class.method'
        // Déjà couvert : tid pointe directement vers `${targetFile}::Class.method`.
      }
    }
    // Préfixe = nom d'une variable locale → on ne peut pas résoudre, on abandonne
    return null;
  }
  // 3. Appel identifiant simple
  // 3a. Symbole local au fichier ?
  const local = symByFile.get(fromFile)?.find(s => s.name === name && (s.kind === 'function' || s.kind === 'class'));
  if (local) return local.id;
  // 3b. Symbole importé ?
  const imp = imports.get(name);
  if (imp && imp.symbol) {
    const targetFile = LANGS.python.resolve(imp.module.replace(/^\.+/, ''), fromFile, allPaths);
    if (targetFile) {
      const tid = `${targetFile}::${imp.symbol}`;
      if (symById.has(tid)) return tid;
    }
  }
  return null;
}

// Construit le graphe de symboles pour tous les fichiers Python téléchargés.
async function buildSymbolGraph() {
  await initTreeSitter();
  const allPaths = new Set(state.files.map(f => f.path));
  const perFile = []; // { path, imports, symbols }
  for (const f of state.files) {
    if (!f.path.endsWith('.py')) continue;
    try {
      const { imports, symbols } = extractPython(f.path, f.content);
      perFile.push({ path: f.path, imports, symbols });
    } catch (e) { console.warn('parse', f.path, e); }
  }

  // Index
  const allSymbols = perFile.flatMap(pf => pf.symbols);
  const symById = new Map(allSymbols.map(s => [s.id, s]));
  const symByFile = new Map();
  for (const s of allSymbols) {
    if (!symByFile.has(s.file)) symByFile.set(s.file, []);
    symByFile.get(s.file).push(s);
  }
  const importsByFile = new Map(perFile.map(pf => [pf.path, pf.imports]));

  // Compteurs entrants/sortants
  for (const s of allSymbols) { s.inDeg = 0; s.outDeg = 0; }

  const edges = [];
  const seen = new Set();
  function addEdge(src, tgt, kind) {
    if (src === tgt) return;
    const k = `${src}→${tgt}→${kind}`;
    if (seen.has(k)) return;
    seen.add(k);
    edges.push({ source: src, target: tgt, kind });
    symById.get(src).outDeg++;
    symById.get(tgt).inDeg++;
  }

  for (const sym of allSymbols) {
    // Héritage
    if (sym.kind === 'class') {
      for (const base of sym.bases) {
        const t = resolveName(base, sym.file, sym.owner, importsByFile.get(sym.file) || new Map(), allPaths, symByFile, symById);
        if (t) addEdge(sym.id, t, 'inherit');
      }
    }
    // Appels (fonctions et méthodes uniquement)
    if (sym.kind === 'function' || sym.kind === 'method') {
      for (const call of sym.calls) {
        const t = resolveName(call, sym.file, sym.owner, importsByFile.get(sym.file) || new Map(), allPaths, symByFile, symById);
        if (t) addEdge(sym.id, t, 'call');
      }
    }
  }

  // Clusters fichier
  const clusters = [...symByFile.keys()].map(p => ({ id: `cluster:${p}`, file: p }));

  state.symGraph = { nodes: allSymbols, edges, clusters };
  state.byId = symById;
}

// =================================================================
//  Pipeline principal
// =================================================================
async function run() {
  state.host = document.getElementById('f-host').value;
  const slug = document.getElementById('f-repo').value.trim();
  state.lang = document.getElementById('f-lang').value;
  state.dir  = document.getElementById('f-dir').value;
  state.hideIsolated = document.getElementById('f-iso').checked;
  const token = document.getElementById('f-token').value.trim();
  if (token) sessionStorage.setItem('pat', token); else sessionStorage.removeItem('pat');
  if (!slug.includes('/')) return alert('Format attendu : owner/repo');
  [state.owner, state.repo] = slug.split('/');

  if (state.view === 'symbols' && state.lang !== 'python') {
    return alert('La vue Symboles est disponible uniquement pour Python pour l\'instant.');
  }

  document.getElementById('empty').classList.add('hidden');
  showProgress('Récupération du dépôt…', 0);
  try {
    let branch = document.getElementById('f-branch').value.trim();
    if (state.host === 'github') {
      if (!branch) {
        const info = await ghJson(`https://api.github.com/repos/${state.owner}/${state.repo}`);
        branch = info.default_branch;
        document.getElementById('f-branch').value = branch;
      }
      state.branch = branch;
      showProgress('Listing des fichiers…', 5);
      const tree = await ghJson(`https://api.github.com/repos/${state.owner}/${state.repo}/git/trees/${branch}?recursive=1`);
      const exts = LANGS[state.lang].exts;
      const blobs = tree.tree.filter(t => t.type === 'blob' && exts.some(e => t.path.endsWith(e)));
      if (!blobs.length) { hideProgress(); return alert('Aucun fichier trouvé pour ce langage.'); }
      const files = [];
      await pool(blobs, 8, async (b) => {
        const url = `https://raw.githubusercontent.com/${state.owner}/${state.repo}/${branch}/${b.path}`;
        const content = await rawText(url);
        files.push({ path: b.path, content, loc: content.split('\n').length });
      }, (d,n)=>showProgress(`Téléchargement ${d}/${n}`, 10 + 60*d/n));
      state.files = files;
    } else {
      const enc = encodeURIComponent(slug);
      if (!branch) { const info = await ghJson(`https://gitlab.com/api/v4/projects/${enc}`); branch = info.default_branch; document.getElementById('f-branch').value = branch; }
      state.branch = branch;
      showProgress('Listing des fichiers…', 5);
      let page = 1, all = [];
      for (;;) {
        const r = await ghJson(`https://gitlab.com/api/v4/projects/${enc}/repository/tree?recursive=true&ref=${branch}&per_page=100&page=${page}`);
        all = all.concat(r);
        if (r.length < 100 || page > 50) break;
        page++;
      }
      const exts = LANGS[state.lang].exts;
      const blobs = all.filter(t => t.type === 'blob' && exts.some(e => t.path.endsWith(e)));
      const files = [];
      await pool(blobs, 8, async (b) => {
        const url = `https://gitlab.com/api/v4/projects/${enc}/repository/files/${encodeURIComponent(b.path)}/raw?ref=${branch}`;
        const content = await rawText(url);
        files.push({ path: b.path, content, loc: content.split('\n').length });
      }, (d,n)=>showProgress(`Téléchargement ${d}/${n}`, 10 + 60*d/n));
      state.files = files;
    }

    if (state.view === 'files') {
      showProgress('Analyse des imports…', 80);
      buildFileGraph();
    } else {
      showProgress('Chargement de tree-sitter…', 75);
      await buildSymbolGraph();
    }
    showProgress('Mise en page…', 95);
    layoutAndRender();
    hideProgress();
  } catch (e) {
    hideProgress();
    alert('Erreur : ' + e.message);
  }
}

// Graphe niveau fichier (conservé tel quel)
function buildFileGraph() {
  const lang = LANGS[state.lang];
  const allPaths = new Set(state.files.map(f => f.path));
  const nodes = state.files.map(f => ({
    id: f.path, path: f.path, name: f.path.split('/').pop(),
    dir: f.path.split('/').slice(0, -1).join('/') || '.',
    loc: f.loc, kind: 'file',
    inDeg: 0, outDeg: 0, externals: new Set(),
  }));
  const byPath = new Map(nodes.map(n => [n.path, n]));
  state.byPath = byPath;
  const edges = [], seen = new Set();
  for (const f of state.files) {
    for (const mod of lang.parse(f.content)) {
      const t = lang.resolve(mod, f.path, allPaths);
      if (t && t !== f.path) {
        const k = f.path + '→' + t;
        if (seen.has(k)) continue;
        seen.add(k);
        edges.push({ source: f.path, target: t, kind: 'call' });
        byPath.get(f.path).outDeg++; byPath.get(t).inDeg++;
      } else {
        byPath.get(f.path).externals.add(mod);
      }
    }
  }
  state.fileGraph = { nodes, edges };
}

// =================================================================
//  Layout dagre + rendu D3
// =================================================================
const NODE_W = 240, NODE_H = 80;
const SYM_W = 220, SYM_H = 64;
let zoomBehavior;

function currentGraph() {
  return state.view === 'files' ? state.fileGraph : state.symGraph;
}

function layoutAndRender() {
  const isSym = state.view === 'symbols';
  const G = currentGraph();
  const nodes = G.nodes.filter(n => {
    if (state.hideIsolated && (n.inDeg + n.outDeg) === 0) return false;
    const hay = isSym ? `${n.file} ${n.name}` : n.path;
    if (state.search && !hay.toLowerCase().includes(state.search.toLowerCase())) return false;
    return true;
  });
  const visIds = new Set(nodes.map(n => n.id));
  const edges = G.edges.filter(e => visIds.has(e.source) && visIds.has(e.target));

  // Dagre — compound pour le mode symboles (clusters fichier)
  const g = new dagre.graphlib.Graph({ compound: isSym });
  g.setGraph({ rankdir: state.dir, nodesep: isSym ? 16 : 30, ranksep: isSym ? 50 : 80, marginx: 30, marginy: 30 });
  g.setDefaultEdgeLabel(() => ({}));

  if (isSym) {
    // Clusters = fichiers réellement utilisés
    const usedFiles = new Set(nodes.map(n => n.file));
    for (const f of usedFiles) g.setNode(`cluster:${f}`, { label: f, clusterLabelPos: 'top', style: 'fill:none' });
    for (const n of nodes) {
      g.setNode(n.id, { width: SYM_W, height: SYM_H });
      g.setParent(n.id, `cluster:${n.file}`);
    }
  } else {
    for (const n of nodes) g.setNode(n.id, { width: NODE_W, height: NODE_H });
  }
  for (const e of edges) g.setEdge(e.source, e.target);
  dagre.layout(g);

  // Position des nœuds
  const W = isSym ? SYM_W : NODE_W;
  const H = isSym ? SYM_H : NODE_H;
  nodes.forEach(n => { const p = g.node(n.id); n.x = p.x - W/2; n.y = p.y - H/2; n.w = W; n.h = H; });

  // Position des clusters
  const clusters = [];
  if (isSym) {
    for (const v of g.nodes()) {
      if (!v.startsWith('cluster:')) continue;
      const c = g.node(v);
      clusters.push({ id: v, file: v.slice('cluster:'.length), x: c.x - c.width/2, y: c.y - c.height/2, w: c.width, h: c.height });
    }
  }

  renderClusters(clusters);
  renderEdges(edges);
  renderNodes(nodes, edges);
  renderSummary(nodes, edges);
  fitToView(nodes);
}

function renderClusters(clusters) {
  const sel = d3.select('#clusters').selectAll('g.cluster').data(clusters, d => d.id);
  sel.exit().remove();
  const enter = sel.enter().append('g').attr('class', 'cluster');
  enter.append('rect').attr('class','cluster-bg').attr('rx',8);
  enter.append('text').attr('class','cluster-label');
  const merged = enter.merge(sel);
  merged.select('rect.cluster-bg').attr('x', d=>d.x).attr('y', d=>d.y).attr('width', d=>d.w).attr('height', d=>d.h);
  merged.select('text.cluster-label').attr('x', d=>d.x + 10).attr('y', d=>d.y + 14).text(d=>d.file);
}

function renderEdges(edges) {
  const sel = d3.select('#edges').selectAll('path').data(edges, d => `${d.source}→${d.target}→${d.kind}`);
  sel.exit().remove();
  const enter = sel.enter().append('path');
  enter.merge(sel)
    .attr('class', d => `edge-path ${d.kind==='inherit' ? 'edge-inherit' : 'edge-call'}`)
    .attr('marker-end', d => d.kind==='inherit' ? 'url(#arr-inh)' : 'url(#arr)')
    .attr('d', d => bezier(d));
}

function bezier(e) {
  const lookup = state.view === 'files' ? state.byPath : state.byId;
  const s = lookup.get(e.source), t = lookup.get(e.target);
  if (!s || !t || s.x === undefined) return '';
  const sx = s.x + s.w, sy = s.y + s.h/2;
  const tx = t.x,        ty = t.y + t.h/2;
  const dx = Math.max(40, Math.abs(tx - sx) / 2);
  return `M${sx},${sy} C${sx + dx},${sy} ${tx - dx},${ty} ${tx},${ty}`;
}

function renderNodes(nodes, edges) {
  const svg = d3.select('#canvas');
  const gNodes = d3.select('#nodes');

  if (!zoomBehavior) {
    zoomBehavior = d3.zoom().scaleExtent([0.1, 4]).on('zoom', (ev) => {
      d3.select('#viewport').attr('transform', ev.transform);
      updateMinimapViewport(ev.transform);
    });
    svg.call(zoomBehavior);
  }

  const maxC = d3.max(nodes, n => n.inDeg + n.outDeg) || 1;
  const colorBand = d3.scaleLinear().domain([0, maxC]).range(['#3a3f4d', getCss('--accent')]);

  const sel = gNodes.selectAll('g.node').data(nodes, d => d.id);
  sel.exit().remove();
  const enter = sel.enter().append('g').attr('class', 'node').style('cursor', 'pointer');

  enter.append('rect').attr('class','node-rect').attr('rx',10);
  enter.append('rect').attr('class','node-band').attr('width',4).attr('rx',2);
  enter.append('text').attr('class','node-kind').attr('x',16).attr('y',16);
  enter.append('text').attr('class','node-title').attr('x',16).attr('y',34);
  enter.append('text').attr('class','node-sub').attr('x',16).attr('y',50);
  enter.append('text').attr('class','node-stat').attr('x',16);
  enter.append('circle').attr('class','port').attr('r',4);
  enter.append('circle').attr('class','port').attr('r',4);

  const merged = enter.merge(sel);
  merged.attr('transform', d => `translate(${d.x},${d.y})`);

  merged.select('rect.node-rect')
    .attr('width', d=>d.w).attr('height', d=>d.h)
    .classed('selected', d => state.selected === d.id);
  merged.select('rect.node-band')
    .attr('height', d=>d.h)
    .attr('fill', d => {
      if (d.kind === 'file')     return colorBand(d.inDeg + d.outDeg);
      if (d.kind === 'class')    return getCss('--accent');
      if (d.kind === 'function') return getCss('--blue');
      if (d.kind === 'method')   return '#7aa6c2';
      return colorBand(d.inDeg + d.outDeg);
    });
  merged.select('text.node-kind').text(d => d.kind);
  merged.select('text.node-title').text(d => truncate(d.kind === 'file' ? d.name : d.name, 28));
  merged.select('text.node-sub').text(d => truncate(d.kind === 'file' ? d.dir : d.file, 32));
  merged.select('text.node-stat')
    .attr('y', d => d.h - 12)
    .text(d => d.kind === 'file'
      ? `↘ ${d.outDeg}   ↙ ${d.inDeg}   · ${d.loc} L`
      : `↘ ${d.outDeg}   ↙ ${d.inDeg}`);

  merged.selectAll('circle.port').each(function(d, i, ns) {
    // 0 = port d'entrée (gauche), 1 = port de sortie (droite)
    const idx = Array.from(ns).indexOf(this);
    d3.select(this).attr('cx', idx === 0 ? 0 : d.w).attr('cy', d.h / 2);
  });

  merged.on('click', (_, d) => {
    state.selected = d.id;
    renderDetail(d);
    highlight(d.id, edges);
  });

  merged.call(d3.drag()
    .on('drag', function (ev, d) {
      d.x += ev.dx; d.y += ev.dy;
      d3.select(this).attr('transform', `translate(${d.x},${d.y})`);
      d3.select('#edges').selectAll('path').attr('d', e => bezier(e));
      drawMinimap(nodes);
    })
    .on('end', () => drawMinimap(nodes))
  );

  drawMinimap(nodes);
}

// Sélection : entrants en bleu, sortants en orange, le reste atténué.
function highlight(id, edges) {
  d3.select('#edges').selectAll('path')
    .classed('out',    e => e.source === id)
    .classed('in',     e => e.target === id)
    .classed('dimmed', e => e.source !== id && e.target !== id)
    .attr('marker-end', e => e.source === id ? 'url(#arr-out)' : e.target === id ? 'url(#arr-in)' : (e.kind==='inherit' ? 'url(#arr-inh)' : 'url(#arr)'));
  const neighbours = new Set([id]);
  for (const e of edges) {
    if (e.source === id) neighbours.add(e.target);
    if (e.target === id) neighbours.add(e.source);
  }
  d3.select('#nodes').selectAll('g.node').select('rect.node-rect')
    .classed('dimmed', d => !neighbours.has(d.id))
    .classed('selected', d => state.selected === d.id);
}

// --- Synthèse + détail ------------------------------------------
function renderSummary(visibleNodes, visibleEdges) {
  const ns = currentGraph().nodes;
  const totalLoc = ns.reduce((a,b) => a + (b.loc||0), 0);
  const topIn  = [...ns].sort((a,b)=>b.inDeg-a.inDeg).slice(0,5);
  const topOut = [...ns].sort((a,b)=>b.outDeg-a.outDeg).slice(0,5);
  const label = n => state.view === 'files' ? n.path : `${n.file} :: ${n.name}`;
  const fmt = (arr, key) => arr.filter(n => n[key] > 0).map(n => `<li class="flex justify-between gap-2"><span class="mono truncate">${label(n)}</span><span class="text-[var(--accent)]">${n[key]}</span></li>`).join('') || '<li class="text-[var(--muted)]">—</li>';
  document.getElementById('summary').innerHTML = `
    <div>Vue : <b>${state.view === 'files' ? 'Fichiers' : 'Symboles'}</b></div>
    <div>Nœuds visibles : <b>${visibleNodes.length}</b> / ${ns.length}</div>
    ${state.view === 'files' ? `<div>Total LOC : <b>${totalLoc}</b></div>` : ''}
    <div>Arêtes visibles : <b>${visibleEdges.length}</b></div>
    <div class="mt-2 text-[var(--muted)] uppercase tracking-wider text-[10px]">Top entrants</div>
    <ul class="space-y-0.5">${fmt(topIn,'inDeg')}</ul>
    <div class="mt-2 text-[var(--muted)] uppercase tracking-wider text-[10px]">Top sortants</div>
    <ul class="space-y-0.5">${fmt(topOut,'outDeg')}</ul>
  `;
}

function renderDetail(n) {
  const G = currentGraph();
  const ins  = G.edges.filter(e => e.target === n.id);
  const outs = G.edges.filter(e => e.source === n.id);
  const lookup = state.view === 'files' ? state.byPath : state.byId;
  const label = id => state.view === 'files' ? id : (lookup.get(id) ? `${lookup.get(id).file} :: ${lookup.get(id).name}` : id);
  const li = (id, kind) => `<li class="mono truncate hover:text-[var(--accent)] cursor-pointer" data-jump="${id}">${kind ? `<span class="text-[var(--muted)] text-[10px] mr-1">${kind}</span>` : ''}${label(id)}</li>`;
  const ghPath = state.view === 'files' ? n.path : n.file;
  const ghLine = state.view === 'symbols' && n.line ? `#L${n.line}` : '';
  const ghUrl = `https://github.com/${state.owner}/${state.repo}/blob/${state.branch}/${ghPath}${ghLine}`;
  const exts = n.externals ? [...n.externals] : [];

  document.getElementById('detail').innerHTML = `
    <div class="text-[var(--text)] font-medium">${n.name || n.path}</div>
    <div class="mono text-[var(--muted)]">${state.view === 'files' ? n.path : `${n.file}${n.line ? ':' + n.line : ''}`}</div>
    <div class="mt-1">${state.view === 'files' ? `LOC : <b>${n.loc}</b> · ` : `${n.kind} · `}entrants <b>${n.inDeg}</b> · sortants <b>${n.outDeg}</b></div>
    <a class="text-[var(--accent)] underline" href="${ghUrl}" target="_blank" rel="noopener">Voir la source ↗</a>
    <div class="mt-2 uppercase tracking-wider text-[10px] text-[var(--muted)]">Entrants</div>
    <ul class="space-y-0.5">${ins.map(e => li(e.source, e.kind)).join('') || '<li class="text-[var(--muted)]">—</li>'}</ul>
    <div class="mt-2 uppercase tracking-wider text-[10px] text-[var(--muted)]">Sortants</div>
    <ul class="space-y-0.5">${outs.map(e => li(e.target, e.kind)).join('') || '<li class="text-[var(--muted)]">—</li>'}</ul>
    ${exts.length ? `<div class="mt-2 uppercase tracking-wider text-[10px] text-[var(--muted)]">Externes</div><ul class="space-y-0.5">${exts.map(e=>`<li class="mono text-[var(--muted)]">${e}</li>`).join('')}</ul>` : ''}
  `;
  document.querySelectorAll('[data-jump]').forEach(el => el.addEventListener('click', () => {
    const id = el.getAttribute('data-jump');
    const node = lookup.get(id);
    if (node) { state.selected = id; renderDetail(node); layoutAndRender(); }
  }));
}

// --- Mini-map ---------------------------------------------------
function drawMinimap(nodes) {
  const svg = d3.select('#minimap');
  svg.selectAll('*').remove();
  if (!nodes.length) return;
  const minX = d3.min(nodes, n => n.x), maxX = d3.max(nodes, n => n.x + n.w);
  const minY = d3.min(nodes, n => n.y), maxY = d3.max(nodes, n => n.y + n.h);
  const w = maxX - minX, h = maxY - minY;
  const W = 200, H = 140, pad = 6;
  const s = Math.min((W - 2*pad)/w, (H - 2*pad)/h);
  const g = svg.append('g').attr('transform', `translate(${pad - minX*s},${pad - minY*s}) scale(${s})`);
  g.selectAll('rect').data(nodes).enter().append('rect')
    .attr('x', d => d.x).attr('y', d => d.y).attr('width', d => d.w).attr('height', d => d.h)
    .attr('fill', '#2a2f3a').attr('rx', 6);
  svg.append('rect').attr('id','mm-vp').attr('fill','none').attr('stroke','var(--accent)').attr('stroke-width',1);
  state._mm = { minX, minY, w, h, s, pad, W, H };
  updateMinimapViewport(d3.zoomTransform(document.getElementById('canvas')));
}
function updateMinimapViewport(t) {
  if (!state._mm) return;
  const rect = document.getElementById('canvas').getBoundingClientRect();
  const { minX, minY, s, pad } = state._mm;
  const x0 = (-t.x)/t.k, y0 = (-t.y)/t.k;
  const x1 = x0 + rect.width/t.k, y1 = y0 + rect.height/t.k;
  d3.select('#mm-vp')
    .attr('x', pad + (x0 - minX)*s).attr('y', pad + (y0 - minY)*s)
    .attr('width', (x1-x0)*s).attr('height', (y1-y0)*s);
}

// --- Utilitaires -------------------------------------------------
function truncate(s, n) { return s && s.length > n ? s.slice(0, n-1) + '…' : (s || ''); }
function getCss(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function showProgress(label, pct) {
  const p = document.getElementById('progress');
  p.classList.remove('hidden');
  document.getElementById('progress-label').textContent = label;
  document.getElementById('progress-bar').style.width = pct + '%';
}
function hideProgress() { document.getElementById('progress').classList.add('hidden'); }

function fitToView(nodes) {
  if (!nodes.length || !zoomBehavior) return;
  const r = document.getElementById('canvas').getBoundingClientRect();
  const minX = d3.min(nodes, n => n.x), maxX = d3.max(nodes, n => n.x + n.w);
  const minY = d3.min(nodes, n => n.y), maxY = d3.max(nodes, n => n.y + n.h);
  const w = maxX - minX, h = maxY - minY;
  const k = Math.min(r.width/(w+80), r.height/(h+80), 1);
  const tx = (r.width - w*k)/2 - minX*k;
  const ty = (r.height - h*k)/2 - minY*k;
  d3.select('#canvas').transition().duration(300)
    .call(zoomBehavior.transform, d3.zoomIdentity.translate(tx, ty).scale(k));
}

// --- Wiring ------------------------------------------------------
document.getElementById('f-go').addEventListener('click', run);
document.getElementById('t-zin').addEventListener('click', () => d3.select('#canvas').transition().call(zoomBehavior.scaleBy, 1.3));
document.getElementById('t-zout').addEventListener('click', () => d3.select('#canvas').transition().call(zoomBehavior.scaleBy, 1/1.3));
document.getElementById('t-fit').addEventListener('click', () => { const v = currentGraph().nodes.filter(n => n.x !== undefined); fitToView(v); });
document.getElementById('t-relayout').addEventListener('click', () => { if (currentGraph().nodes.length) layoutAndRender(); });
document.getElementById('f-iso').addEventListener('change', e => { state.hideIsolated = e.target.checked; if (currentGraph().nodes.length) layoutAndRender(); });
document.getElementById('f-search').addEventListener('input', e => { state.search = e.target.value; if (currentGraph().nodes.length) layoutAndRender(); });
document.getElementById('f-dir').addEventListener('change', e => { state.dir = e.target.value; if (currentGraph().nodes.length) layoutAndRender(); });

// Toggle vue (fichiers / symboles)
document.querySelectorAll('#f-view button').forEach(b => b.addEventListener('click', async () => {
  document.querySelectorAll('#f-view button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  state.view = b.getAttribute('data-v');
  state.selected = null;
  // Si on a déjà téléchargé des fichiers, on reconstruit sans re-télécharger.
  if (state.files.length) {
    if (state.view === 'symbols') {
      if (state.lang !== 'python') return alert('Vue Symboles : Python uniquement pour l\'instant.');
      showProgress('Analyse des symboles…', 50);
      await buildSymbolGraph();
      hideProgress();
    } else {
      buildFileGraph();
    }
    layoutAndRender();
  }
}));

// Pré-remplissage
document.getElementById('f-repo').value = detectRepoFromUrl() || 'CHU-Brest/fictomed';
const cached = sessionStorage.getItem('pat');
if (cached) document.getElementById('f-token').value = cached;
</script>
